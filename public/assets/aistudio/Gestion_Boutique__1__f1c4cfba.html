<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--cd:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#0f6e56;--bd:#ddd9cf;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--cd:#222226;--tx:#efeee9;--mu:#a09f98;--ac:#4cc4a0;--bd:#38383d;--bad:#f2867e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17171a;--cd:#222226;--tx:#efeee9;--mu:#a09f98;--ac:#4cc4a0;--bd:#38383d;--bad:#f2867e;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}header b{font-size:18px}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px}nav button{white-space:nowrap;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:8px 14px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:8px 12px 40px;max-width:760px;margin:auto}.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:18px}h3{margin:14px 0 6px;font-size:15px;color:var(--mu)}
input,select{width:100%;padding:10px;margin:4px 0;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}.row>button{flex:0 0 auto}
button.p{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer;margin-top:6px}
button.g{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:500;font-size:13px}
.big{font-size:28px;font-weight:700;color:var(--ac)}.mu{color:var(--mu);font-size:14px}.bad{color:var(--bad);font-weight:600}
.bar{height:10px;background:var(--ac);border-radius:5px;min-width:2px}.ih{font-size:22px;font-weight:700;text-align:center;color:var(--ac);margin-bottom:2px}.it td,.it th{border:1px solid var(--bd)}.it td:nth-child(2){white-space:normal}.sig{display:flex;justify-content:flex-end;margin-top:14px}.at input,.it input{min-width:80px;margin:0}.it td:nth-child(2) input{min-width:170px}.sig div{width:190px;text-align:center;border-top:1px solid var(--tx);padding-top:6px;margin-top:56px}.k{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  $("#lock").hidden=false;
  $("#lock").innerHTML=`<div class="card"><h2>🔐 ${first?"Créer votre mot de passe":"Mot de passe"}</h2>
  <p class="mu">${first?"Ce mot de passe sera demandé à chaque ouverture (6 caractères minimum).":"Entrez votre mot de passe pour ouvrir le logiciel."}</p>
  <input id="pw" type="password" placeholder="Mot de passe" autocomplete="off">
  ${first?'<input id="pw2" type="password" placeholder="Confirmer le mot de passe">':""}
  <div id="err" class="bad"></div><button class="p" id="go">${first?"Enregistrer":"Ouvrir"}</button></div>`;
  const go=async()=>{const p=$("#pw").value;
    if(first){if(p.length<6)return $("#err").textContent="6 caractères minimum.";
      if(p!==$("#pw2").value)return $("#err").textContent="Les mots de passe diffèrent.";
      DB.pw=await hash(p);save();openApp();}
    else if(await hash(p)===DB.pw)openApp();else{$("#err").textContent="Mot de passe incorrect.";$("#pw").value=""}};
  $("#go").onclick=go;$("#lock").onkeydown=e=>{if(e.key==="Enter")go()};
}
function openApp(){$("#lock").hidden=true;$("#app").hidden=false;nav();render()}
function lockApp(){cart=[];showLock()}

/* ---------- Imprimer / JPEG ---------- */
function tools(t){return `<div class="tl" data-html2canvas-ignore><button class="g" onclick="doPrint()">🖨️ Imprimer</button><button class="g" onclick="saveJpg('${t}')">🖼️ Enregistrer en JPEG</button></div><div class="card"><div class="ih">Maison La Grance divine</div><div class="mu" style="text-align:center">${t} · ${new Date().toLocaleDateString("fr-FR")}</div></div>`}
function doPrint(){try{window.print()}catch(e){alert("L’impression n’est pas disponible ici. Utilisez « Enregistrer en JPEG » puis imprimez l’image.")}}
async function saveJpg(t){
  try{
    const dl=window.claude?await claude.use("downloads"):null;
    if(!dl)return alert("L’enregistrement n’est pas disponible dans cette vue.");
    if(!window.html2canvas)return alert("Outil d’image indisponible (connexion nécessaire).");
    const c=await html2canvas($("#v"),{backgroundColor:getComputedStyle(document.body).backgroundColor,scale:2});
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.92));
    await dl.save({filename:t.toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-"+dk(new Date())+".jpg",data:blob});
  }catch(e){if(!e||e.code!=="declined")alert("Impossible d’enregistrer l’image.")}
}

/* ---------- Navigation ---------- */
function nav(){$("#nav").innerHTML=TABS.map(t=>`<button class="${t[0]===tab?"on":""}" onclick="tab='${t[0]}';NOTICE='';nav();render()">${t[1]}</button>`).join("")}
function render(){$("#v").innerHTML=V[tab]()}
const P=id=>DB.products.find(p=>p.id==id);
const pn=p=>p.name+(p.quality?" ("+p.quality+")":"");

const V={
facture(){
  if(!cart.length)cart=[{},{},{},{},{}];const dl=DB.products.map(p=>`<option value="${esc(pn(p))}">`).join("");
  const tot=cart.reduce((s,l)=>s+(l.q||0)*(l.pu||0),0);
  const last=DB.invoices.slice(-20).reverse().map(i=>`<tr><td>N°${i.id}</td><td>${i.d}</td><td>${esc(i.client)}</td><td>${fm(i.total)}${i.notes&&i.notes.length?" ⚠":""}</td><td><button class="g" onclick="edit(${i.id})">✏️ Modifier</button></td></tr>${i.notes&&i.notes.length?`<tr><td colspan="5" class="bad" style="white-space:normal;font-size:13px">${i.notes.map(n=>esc(n)).join("<br>")}</td></tr>`:""}`).join("");
  return `${NOTICE?`<div class="card" style="border-color:var(--ac)">${NOTICE}</div>`:""}<div class="card">${editId?`<div class="bad" style="margin-bottom:8px">✏️ Modification de la facture N°${editId} <button class="g" onclick="editId=null;cart=[];FC='';render()">Annuler</button></div>`:""}<div class="ih">Maison La Grance divine</div><div class="mu" style="text-align:center;margin-bottom:10px">Facture N°${editId||DB.invoices.length+1} · ${editId?DB.invoices.find(i=>i.id==editId).d:new Date().toLocaleDateString("fr-FR")}</div><input id="fc" placeholder="Nom du client" value="${esc(FC)}" oninput="FC=this.value">
  <datalist id="dl">${dl}</datalist>
  <div class="tw" style="margin-top:10px"><table class="it"><tr><th>Quantité</th><th>Désignation</th><th>P.U</th><th>PT</th><th></th></tr>${cart.map((l,i)=>`<tr><td><input type="number" min="1" value="${l.q||""}" oninput="cart[${i}].q=this.value;fcalc()"></td><td><input list="dl" value="${esc(l.d||"")}" oninput="cart[${i}].d=this.value" onchange="pick(${i},this.value)" placeholder="Désignation"></td><td><input type="number" min="0" step="any" value="${l.pu||""}" oninput="cart[${i}].pu=this.value;fcalc()"></td><td id="ft${i}">${fm((l.q||0)*(l.pu||0))}</td><td><button class="g" onclick="cart.splice(${i},1);render()">✕</button></td></tr>`).join("")}<tr><td colspan="3" style="text-align:right"><b>Total</b></td><td id="ftt"><b>${fm(tot)}</b></td><td></td></tr></table></div>
  <button class="g" style="margin-top:8px" onclick="cart.push({});render()">+ Ajouter une ligne</button><div id="fw" class="bad" style="margin-top:8px">${warnHtml()}</div><div class="sig"><div class="mu">Signature</div></div><button class="p" onclick="valid()">${editId?"Enregistrer les modifications":"Valider la facture"}</button></div>
  <div class="card"><h2>Dernières factures</h2><div class="tw"><table>${last||'<tr><td class="mu">Aucune facture</td></tr>'}</table></div></div>`},
arrivage(){
  if(!AR.length)AR=[{},{},{}];
  const last=DB.arrivals.slice(-8).reverse().map(a=>`<tr><td>${a.d}</td><td>${esc(a.name)}${a.quality?" ("+esc(a.quality)+")":""}</td><td>+${a.q}</td><td>${fm(a.cost)}</td></tr>`).join("");
  const rows=AR.map((r,i)=>`<tr><td><input list="pl" value="${esc(r.n||"")}" oninput="AR[${i}].n=this.value" placeholder="Produit"></td><td><input value="${esc(r.ql||"")}" oninput="AR[${i}].ql=this.value" placeholder="Qualité"></td><td><input type="number" min="1" value="${r.q||""}" oninput="AR[${i}].q=this.value;calc()"></td><td><input type="number" min="0" step="any" value="${r.c||""}" oninput="AR[${i}].c=this.value;calc()"></td><td><input type="number" min="0" step="any" value="${r.p||""}" oninput="AR[${i}].p=this.value;calc()"></td><td id="at${i}">${fm((r.q||0)*(r.c||0))}</td><td id="vt${i}">${fm((r.q||0)*(r.p||0))}</td><td><button class="g" onclick="AR.splice(${i},1);render()">✕</button></td></tr>`).join("");
  return `<div class="card"><h2>Nouvel arrivage</h2><datalist id="pl">${[...new Set(DB.products.map(p=>p.name))].map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
  <div class="tw"><table class="it at"><tr><th>Nom du produit</th><th>Qualité</th><th>Quantité</th><th>Prix d’achat unitaire</th><th>Prix de vente unitaire</th><th>Prix d’achat total</th><th>Prix de vente total</th><th></th></tr>${rows}<tr><td colspan="5" style="text-align:right"><b>Total</b></td><td id="tat"><b>${fm(AR.reduce((s,r)=>s+(r.q||0)*(r.c||0),0))}</b></td><td id="tvt"><b>${fm(AR.reduce((s,r)=>s+(r.q||0)*(r.p||0),0))}</b></td><td></td></tr></table></div>
  <button class="g" style="margin-top:8px" onclick="AR.push({});render()">+ Ajouter une ligne</button>
  <div id="err" class="bad"></div><button class="p" onclick="arr()">Enregistrer l’arrivage</button></div>
  <div class="card"><h2>Derniers arrivages</h2><div class="tw"><table>${last||'<tr><td class="mu">Aucun arrivage</td></tr>'}</table></div></div>`},
stock(){
  const val=DB.products.reduce((s,p)=>s+p.qty*p.cost,0);
  return `${tools("Stock")}<div class="card"><h2>Stock</h2><div class="k"><div><div class="mu">Produits</div><div class="big">${DB.products.length}</div></div><div><div class="mu">Valeur du stock</div><div class="big">${fm(val)}</div></div></div></div>
  <div class="card tw"><table><tr><th>Produit</th><th>Qualité</th><th>Qté</th><th>Achat</th><th>Vente</th></tr>${DB.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.quality||"—")}</td><td class="${p.qty<=5?"bad":""}">${p.qty}${p.qty<=5?" ⚠":""}</td><td>${fm(p.cost)}</td><td>${fm(p.price)}</td></tr>`).join("")||'<tr><td class="mu">Stock vide</td></tr>'}</table></div>`},
honneur(){
  const m={};DB.invoices.forEach(i=>{const k=i.client.trim().toLowerCase();m[k]=m[k]||{n:i.client,t:0,c:0};m[k].t+=i.total;m[k].c++});
  const r=Object.values(m).sort((a,b)=>b.t-a.t).slice(0,10);
  if(!r.length)return `<div class="card"><h2>Client d’honneur</h2><p class="mu">Aucune facture pour l’instant.</p></div>`;
  return `<div class="card"><h2>👑 Client d’honneur</h2><div class="big">${esc(r[0].n)}</div><div class="mu">${fm(r[0].t)} dépensés en ${r[0].c} facture(s)</div></div>
  <div class="card tw"><h2>Classement</h2><table><tr><th>#</th><th>Client</th><th>Achats</th><th>Total</th></tr>${r.map((c,i)=>`<tr><td>${i+1}</td><td>${esc(c.n)}</td><td>${c.c}</td><td>${fm(c.t)}</td></tr>`).join("")}</table></div>`},
jour(){
  const d=window.JD||dk(new Date()),iv=DB.invoices.filter(i=>i.d===d);
  return `${tools("Gain par jour")}<div class="card"><h2>Gain par jour</h2><input type="date" value="${d}" onchange="JD=this.value;render()">
  <div class="k"><div><div class="mu">Gain net</div><div class="big">${fm(iv.reduce((s,i)=>s+i.profit,0))}</div></div><div><div class="mu">Chiffre d’affaires</div><div class="big">${fm(iv.reduce((s,i)=>s+i.total,0))}</div></div></div>
  <p class="mu">${iv.length} facture(s) ce jour</p></div>
  <div class="card tw"><table><tr><th>N°</th><th>Client</th><th>CA</th><th>Gain</th></tr>${iv.map(i=>`<tr><td>${i.id}</td><td>${esc(i.client)}</td><td>${fm(i.total)}</td><td>${fm(i.profit)}</td></tr>`).join("")||'<tr><td class="mu">Aucune vente ce jour</td></tr>'}</table></div>`},
semaine(){
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d)}
  const rows=days.map(d=>{const k=dk(d),iv=DB.invoices.filter(i=>i.d===k);return{l:d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric"}),g:iv.reduce((s,i)=>s+i.profit,0),c:iv.reduce((s,i)=>s+i.total,0),n:iv.length}});
  const mx=Math.max(1,...rows.map(r=>Math.abs(r.g)));
  return `${tools("Gain de la semaine")}<div class="card"><h2>Gain de la semaine</h2><div class="k"><div><div class="mu">Gain net</div><div class="big">${fm(rows.reduce((s,r)=>s+r.g,0))}</div></div><div><div class="mu">Chiffre d’affaires</div><div class="big">${fm(rows.reduce((s,r)=>s+r.c,0))}</div></div></div></div>
  <div class="card"><h2>7 derniers jours</h2>${rows.map(r=>`<div style="margin:8px 0"><div class="row mu"><span>${r.l} · ${r.n} facture(s)</span><span style="text-align:right">${fm(r.g)}</span></div><div class="bar" style="width:${Math.abs(r.g)/mx*100}%"></div></div>`).join("")}</div>`},
mois(){
  const mo=window.MO||dk(new Date()).slice(0,7),iv=DB.invoices.filter(i=>i.d.startsWith(mo)),by={};
  iv.forEach(i=>{by[i.d]=by[i.d]||{n:0,c:0,g:0};by[i.d].n++;by[i.d].c+=i.total;by[i.d].g+=i.profit});
  return `${tools("Gain du mois")}<div class="card"><h2>Gain du mois</h2><input type="month" value="${mo}" onchange="MO=this.value;render()">
  <div class="k"><div><div class="mu">Gain net</div><div class="big">${fm(iv.reduce((s,i)=>s+i.profit,0))}</div></div><div><div class="mu">Chiffre d’affaires</div><div class="big">${fm(iv.reduce((s,i)=>s+i.total,0))}</div></div></div>
  <p class="mu">${iv.length} facture(s) · base de données : ${DB.invoices.length} factures, ${DB.products.length} produits, ${DB.arrivals.length} arrivages enregistrés.</p></div>
  <div class="card tw"><table><tr><th>Jour</th><th>Fact.</th><th>CA</th><th>Gain</th></tr>${Object.keys(by).sort().map(k=>`<tr><td>${k.slice(8)}/${k.slice(5,7)}</td><td>${by[k].n}</td><td>${fm(by[k].c)}</td><td>${fm(by[k].g)}</td></tr>`).join("")||'<tr><td class="mu">Aucune vente ce mois-ci</td></tr>'}</table></div>`}
};

/* ---------- Actions ---------- */
const mt=d=>DB.products.find(x=>pn(x).toLowerCase()===d.toLowerCase()||(!x.quality&&x.name.toLowerCase()===d.toLowerCase()));
function oldQ(p){const iv=editId&&DB.invoices.find(i=>i.id==editId);if(!iv)return 0;return iv.lines.filter(l=>l.pid?l.pid==p.id:mt(l.d||l.name||"")===p).reduce((s,l)=>s+(l.q||0),0)}
function plan(ls){const left={},notes=[];
  const out=ls.map(l=>{const p=mt(l.d);if(!p)return{...l,p:null};
    if(left[p.id]===undefined)left[p.id]=p.qty+oldQ(p);
    const q=Math.max(0,Math.min(l.q,left[p.id]));
    if(q<l.q)notes.push(q===0?"Stock fini : "+l.d+", ligne retirée":"Stock insuffisant : "+l.d+", quantité ramenée de "+l.q+" à "+q);
    left[p.id]-=q;
    if(q>0&&left[p.id]===0&&q===l.q)notes.push("Stock épuisé : "+l.d);
    return{...l,q,p}});
  return{out,notes}}
function warnHtml(){const ls=cart.filter(l=>(l.d||"").trim()&&parseFloat(l.q)>0).map(l=>({q:parseFloat(l.q),d:l.d.trim(),pu:parseFloat(l.pu)||0}));return plan(ls).notes.map(x=>"⚠ "+esc(x)).join("<br>")}
function edit(id){const iv=DB.invoices.find(i=>i.id==id);if(!iv)return;editId=id;FC=iv.client;NOTICE="";cart=iv.lines.map(l=>({q:l.q,d:l.d||l.name,pu:l.pu!==undefined?l.pu:l.price}));tab="facture";nav();render();scrollTo(0,0)}
function pick(i,v){const p=mt(v.trim());if(p&&!cart[i].pu){cart[i].pu=p.price}cart[i].d=v;render()}
function fcalc(){let t=0;cart.forEach((l,i)=>{const x=(l.q||0)*(l.pu||0);t+=x;const e=$("#ft"+i);if(e)e.textContent=fm(x)});$("#ftt").innerHTML="<b>"+fm(t)+"</b>";$("#fw").innerHTML=warnHtml()}
function valid(){const ls=cart.filter(l=>(l.d||"").trim()||l.q||l.pu).map(l=>({q:parseFloat(l.q)||0,d:(l.d||"").trim(),pu:parseFloat(l.pu)||0}));
  if(!ls.length)return alert("Remplissez au moins une ligne.");
  if(ls.some(l=>!l.d||l.q<=0))return alert("Chaque ligne doit avoir une quantité et une désignation.");
  const {out,notes}=plan(ls);
  if(!out.some(l=>l.q>0))return alert(notes.join("\n")||"Stock fini.");
  const iv=editId?DB.invoices.find(i=>i.id==editId):null;
  if(iv)iv.lines.forEach(l=>{const p=l.pid?P(l.pid):mt(l.d||l.name||"");if(p)p.qty+=l.q});
  const fin=out.filter(l=>l.q>0).map(l=>({q:l.q,d:l.d,pu:l.pu,cost:l.p?l.p.cost:0,pid:l.p?l.p.id:null}));
  fin.forEach(l=>{if(l.pid)P(l.pid).qty-=l.q});
  const rec={id:iv?iv.id:DB.invoices.length+1,d:iv?iv.d:dk(new Date()),client:FC.trim()||"Client comptoir",lines:fin,total:fin.reduce((s,l)=>s+l.q*l.pu,0),profit:fin.reduce((s,l)=>s+l.q*(l.pu-l.cost),0),notes};
  if(iv)Object.assign(iv,rec);else DB.invoices.push(rec);
  NOTICE="✅ Facture N°"+rec.id+(iv?" modifiée.":" enregistrée.")+(notes.length?"<br><span class=\"bad\">"+notes.map(n=>"⚠ "+esc(n)).join("<br>")+"</span>":"");
  cart=[];FC="";editId=null;save();render();scrollTo(0,0)}
function calc(){let a=0,v=0;AR.forEach((r,i)=>{const x=(r.q||0)*(r.c||0),y=(r.q||0)*(r.p||0);a+=x;v+=y;const e=$("#at"+i),f=$("#vt"+i);if(e)e.textContent=fm(x);if(f)f.textContent=fm(y)});$("#tat").innerHTML="<b>"+fm(a)+"</b>";$("#tvt").innerHTML="<b>"+fm(v)+"</b>"}
function arr(){const rs=AR.filter(r=>(r.n||"").trim()||r.q);
  if(!rs.length)return $("#err").textContent="Remplissez au moins une ligne.";
  for(const r of rs){if(!(r.n||"").trim()||!(parseInt(r.q)>0)||!(parseFloat(r.p)>=0))return $("#err").textContent="Chaque ligne doit avoir un nom, une quantité et un prix de vente."}
  rs.forEach((r,k)=>{const n=r.n.trim(),ql=(r.ql||"").trim(),q=parseInt(r.q),c=parseFloat(r.c)||0,pr=parseFloat(r.p);
    let p=DB.products.find(x=>x.name.toLowerCase()===n.toLowerCase()&&(x.quality||"").toLowerCase()===ql.toLowerCase());
    if(!p){p={id:Date.now()+k,name:n,quality:ql,qty:0,cost:c,price:pr};DB.products.push(p)}
    p.qty+=q;p.cost=c;p.price=pr;
    DB.arrivals.push({d:dk(new Date()),name:p.name,quality:p.quality,q,cost:c})});
  AR=[{},{},{}];save();render()}

showLock();
</script></body></html>
